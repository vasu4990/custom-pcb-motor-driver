name: Design Checks

on:
  push:
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Validate YAML
        run: python -c "import yaml; yaml.safe_load(open('hardware/design_values.yaml', encoding='utf-8'))"
